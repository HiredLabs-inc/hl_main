<section aria-label="Counts" class="flex flex-wrap gap-3">
    {% for item in counts %}
        <a href="{% url 'staff' %}?{% for key, value in item.params.items %}{{ key }}={{ value|urlencode }}{% if not forloop.last %}&amp;{% endif %}{% endfor %}"
           class="admin_panel min-w-[9rem] flex-1 rounded-lg border border-hl-line bg-white px-4 py-3 hover:border-hl-steel hover:bg-hl-mist sm:flex-none">
            <span class="block text-2xl font-semibold tabular-nums text-hl-navy">{{ item.count }}</span>
            <span class="block text-sm text-hl-muted">{{ item.label }}</span>
        </a>
    {% endfor %}
</section>
