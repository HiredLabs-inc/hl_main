services:
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    volumes:
      # need to include whole app directory
      # as tailwind watches django templates
      # see frontend/tailwind.config.js
      - .:/app
    working_dir: /app/frontend
    command: sh -c "npm install && npm run watch"
  gcloud:
    image: google/cloud-sdk:latest
    volumes:
      - ./gcloud:/root/.config/gcloud
      - .:/app
    working_dir: /app
    profiles:
      - 'gcloud'
    # don't need to run gcloud in dev environment
    # so just run a command that does nothing and exits
    command: echo ''
  django:
    build:
      context: .
      args:
        - DJANGO_SETTINGS_MODULE=hl_main.settings.dev
    depends_on:
      # - django-tasks
      - db
    volumes:
      - .:/app
      # user ADC from `gcloud auth application-default login` (no key files)
      - $HOME/.config/gcloud:/root/.config/gcloud:ro

    ports:
      - 8000:8000
    command: python manage.py runserver_plus 0.0.0.0:8000
    environment:
      - DJANGO_SETTINGS_MODULE=hl_main.settings.dev

  db:
    # pinned: data in pgdata is Postgres 17 format
    image: postgres:17
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      # named so the dev database survives container recreation
      - pgdata:/var/lib/postgresql/data
  django-tasks:
    build:
      context: .
      args:
        - DJANGO_SETTINGS_MODULE=hl_main.settings.dev
    depends_on:
      - db
    volumes:
      - .:/app
      - $HOME/.config/gcloud:/root/.config/gcloud:ro
    ports:
      - "8001:8001"
    environment:
      - DJANGO_ROLE=tasks
      - DJANGO_SETTINGS_MODULE=hl_main.settings.dev
    command: python manage.py runserver 0.0.0.0:8001

volumes:
  pgdata:
