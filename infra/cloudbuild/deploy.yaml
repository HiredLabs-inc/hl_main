# Build, migrate and deploy one environment.
# Run by the hl-<env>-deploy Cloud Build triggers (infra/terraform/modules/hl-env):
#   staging -> stage (hl-main-stage), main -> prod (hl-main-prod).
substitutions:
  _ENV: stage
  _REGION: us-west1
  _IMAGE: us-west1-docker.pkg.dev/hl-main-prod/hl-images/hl-main
  _START_SQL: "false"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s

steps:
- id: pull-cache
  name: gcr.io/cloud-builders/docker
  entrypoint: bash
  args: ['-c', 'docker pull $_IMAGE:$_ENV || exit 0']

- id: build
  name: gcr.io/cloud-builders/docker
  args: ['build', '-t', '$_IMAGE:$SHORT_SHA', '-t', '$_IMAGE:$_ENV', '--cache-from', '$_IMAGE:$_ENV', '.']

- id: push
  name: gcr.io/cloud-builders/docker
  args: ['push', '--all-tags', '$_IMAGE']

# Stage's database is stopped by default; start it (the nightly scheduler stops it again).
- id: start-sql
  name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  entrypoint: bash
  args:
  - -c
  - |
    if [ "$_START_SQL" = "true" ]; then
      gcloud sql instances patch hl-$_ENV-sql --activation-policy=ALWAYS --quiet
    fi

- id: migrate
  name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  entrypoint: bash
  args:
  - -c
  - |
    gcloud run jobs update hl-$_ENV-migrate --region=$_REGION --image=$_IMAGE:$SHORT_SHA &&
    gcloud run jobs execute hl-$_ENV-migrate --region=$_REGION --wait &&
    gcloud run jobs update hl-$_ENV-manage --region=$_REGION --image=$_IMAGE:$SHORT_SHA

- id: deploy-web
  name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  args: ['gcloud', 'run', 'deploy', 'hl-$_ENV-web', '--region=$_REGION', '--image=$_IMAGE:$SHORT_SHA']

- id: deploy-worker
  name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  args: ['gcloud', 'run', 'deploy', 'hl-$_ENV-worker', '--region=$_REGION', '--image=$_IMAGE:$SHORT_SHA']
